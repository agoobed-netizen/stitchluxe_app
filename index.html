<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StitchLuxe — Bespoke Marketplace & Wardrobe Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /><link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

  <!-- TOP BRAND HEADER -->
  <header class="sticky top-0 z-50 bg-slate-900 text-white px-4 py-3 shadow-md">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('catalog')">
        <div class="bg-amber-500 text-slate-900 font-black text-xl px-3 py-1 rounded-lg">SL</div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-white block leading-none">StitchLuxe</span>
          <span class="text-[10px] text-amber-400 font-medium tracking-wide">Bespoke & Wardrobe Ecosystem</span>
        </div>
      </div>
      
      <!-- AUTH & VENDOR CONTROLS -->
      <div class="flex items-center gap-2">
        <div id="auth-user-badge" class="hidden text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-2">
          <i class="fa-solid fa-user-check text-emerald-400"></i>
          <span id="user-display-name" class="font-semibold text-slate-200"></span>
          <button onclick="logoutUser()" class="text-slate-400 hover:text-rose-400 ml-1"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <button id="login-trigger-btn" onclick="openAuthModal()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-right-to-bracket"></i> <span>Login / Sign Up</span>
        </button>

        <button onclick="toggleVendorDashboard()" id="role-toggle-btn" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-store"></i> <span id="role-toggle-text">Vendor Portal</span>
        </button>
      </div>
    </div>
  </header>

  <!-- NAVIGATION BAR -->
  <nav class="bg-slate-800 text-white px-4 py-2 text-sm sticky top-[57px] z-40 overflow-x-auto border-b border-slate-700">
    <div class="max-w-6xl mx-auto flex gap-4 whitespace-nowrap">
      <button onclick="switchTab('catalog')" id="nav-catalog" class="nav-btn py-1.5 px-3 rounded-lg font-medium bg-amber-500 text-slate-900">
        <i class="fa-solid fa-shirt mr-1"></i> Bespoke Catalog
      </button>
      <button onclick="switchTab('resale')" id="nav-resale" class="nav-btn py-1.5 px-3 rounded-lg font-medium text-slate-300 hover:text-white">
        <i class="fa-solid fa-tag mr-1"></i> Wardrobe Resale
      </button>
      <button onclick="switchTab('sellers')" id="nav-sellers" class="nav-btn py-1.5 px-3 rounded-lg font-medium text-slate-300 hover:text-white">
        <i class="fa-solid fa-users mr-1"></i> Designers & Sellers
      </button>
      <button onclick="switchTab('internship')" id="nav-internship" class="nav-btn py-1.5 px-3 rounded-lg font-medium text-slate-300 hover:text-white">
        <i class="fa-solid fa-graduation-cap mr-1"></i> Apprentice Academy
      </button>
      <button onclick="switchTab('tracker')" id="nav-tracker" class="nav-btn py-1.5 px-3 rounded-lg font-medium text-slate-300 hover:text-white">
        <i class="fa-solid fa-truck-fast mr-1"></i> Live Order Tracker
      </button>
      <button onclick="switchTab('measurements')" id="nav-measurements" class="nav-btn py-1.5 px-3 rounded-lg font-medium text-slate-300 hover:text-white">
        <i class="fa-solid fa-ruler-combined mr-1"></i> Measurement Vault
      </button>
    </div>
  </nav>

  <!-- DYNAMIC VIEW CONTAINER -->
  <main id="main-content" class="max-w-6xl mx-auto px-4 pt-6">
    <!-- View content injects dynamically via app.js -->
  </main>

  <!-- EASY LOGIN / SIGNUP MODAL -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-slate-900">Welcome to StitchLuxe</h2>
        <p class="text-xs text-slate-500 mt-1">Sign in seamlessly with Email, Phone, or WhatsApp</p>
      </div>

      <!-- ROLE SELECTOR TABS -->
      <div class="flex bg-slate-100 p-1 rounded-xl mb-5 text-xs font-bold">
        <button id="auth-tab-client" onclick="switchAuthRole('client')" class="flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm">
          Customer
        </button>
        <button id="auth-tab-seller" onclick="switchAuthRole('seller')" class="flex-1 py-2 rounded-lg text-slate-500">
          Designer / Seller
        </button>
      </div>

      <!-- AUTH FORM -->
      <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Full Name *</label>
          <input type="text" id="auth-fullname" placeholder="e.g. Samuel Adebayo" required class="w-full border border-slate-300 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-500"/>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Email or Phone / WhatsApp Number *</label>
          <input type="text" id="auth-contact" placeholder="08012345678 or name@email.com" required class="w-full border border-slate-300 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-500"/>
        </div>

        <div id="seller-business-name-group" class="hidden">
          <label class="block text-xs font-bold text-slate-700 mb-1">Brand / Fashion House Name *</label>
          <input type="text" id="auth-business" placeholder="e.g. Royal Stitches Ltd" class="w-full border border-slate-300 rounded-xl p-3 text-xs focus:outline-none focus:border-amber-500"/>
        </div>

        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">
          <i class="fa-solid fa-bolt text-amber-400 mr-1"></i> Instant Sign In / Register
        </button>
      </form>

      <div class="mt-4 pt-4 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400">By signing in, you agree to StitchLuxe Terms of Service.</p>
      </div>
    </div>
  </div>

  <!-- PAYMENT MODAL -->
  <div id="payment-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl relative">
      <button onclick="closePaymentModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="payment-modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
