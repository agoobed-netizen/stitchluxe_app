<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StitchLuxe — Bespoke Fashion Ecosystem</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
  />

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased">

  <!-- TOP HEADER / BRAND BAR -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-amber-400 font-black text-xl tracking-tight">STITCH<span class="text-white">LUXE</span></span>
        <span class="text-[10px] bg-amber-400/10 text-amber-400 font-bold px-2 py-0.5 rounded border border-amber-400/20">BESPOKE</span>
      </div>
      <div id="user-profile-badge" class="text-xs text-slate-400 font-medium">
        <!-- Managed by app.js authentication -->
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- ==========================================
         STITCHLUXE FEATURE NAVIGATION MENU BAR
         ========================================== -->
    <nav class="flex items-center gap-2 overflow-x-auto pb-3 mb-6 border-b border-slate-200 scrollbar-none">
      
      <!-- 1. Catalog Tab -->
      <button 
        id="tab-catalog" 
        onclick="loadTabContent('catalog')" 
        class="px-4 py-2 rounded-xl bg-slate-900 text-amber-400 font-bold text-xs whitespace-nowrap transition-all shadow-sm">
        <i class="fa-solid fa-store mr-1.5"></i> Bespoke Catalog
      </button>
      
      <!-- 2. Bespoke Orders & Garment Tracker Tab -->
      <button 
        id="tab-orders" 
        onclick="loadTabContent('orders')" 
        class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold text-xs whitespace-nowrap transition-all">
        <i class="fa-solid fa-scissors mr-1.5"></i> Bespoke Orders
      </button>
      
      <!-- 3. Wardrobe Resale Storefront Tab -->
      <button 
        id="tab-resale" 
        onclick="loadTabContent('resale')" 
        class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold text-xs whitespace-nowrap transition-all">
        <i class="fa-solid fa-shirt mr-1.5"></i> Wardrobe Resale
      </button>
      
      <!-- 4. Apprentice & Talent Portal Tab -->
      <button 
        id="tab-apprentice" 
        onclick="loadTabContent('apprentice')" 
        class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold text-xs whitespace-nowrap transition-all">
        <i class="fa-solid fa-user-graduate mr-1.5"></i> Apprentice Portal
      </button>
      
    </nav>

    <!-- ==========================================
         DYNAMIC VIEWPORT CONTAINER
         ========================================== -->
    <div id="module-viewport" class="min-h-[400px]">
      <!-- loadTabContent() injects views here dynamically -->
    </div>

  </main>

  <!-- ==========================================
       SCRIPT LOADING ORDER (CRITICAL)
       ========================================== -->
  <!-- 1. Feature modules load first -->
  <script src="orders.js"></script>
  <script src="resale.js"></script>
  <script src="apprentice.js"></script>

  <!-- 2. Main engine script loads last -->
  <script src="app.js"></script>
</body>
</html>
