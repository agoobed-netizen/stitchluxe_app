<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StitchLuxe - Bespoke Fashion & Wardrobe Ecosystem</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased">

  <!-- AUTHENTICATION SCREEN (DEFAULT VIEW FOR UNLEADED USERS) -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-500 mb-1">
          <i class="fa-solid fa-scissors text-2xl"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Welcome to StitchLuxe</h2>
        <p class="text-xs text-slate-500">Bespoke Couture, Wardrobe Resale & Apprentice Academy</p>
      </div>

      <form onsubmit="handleAuthSubmit(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="auth-email" required placeholder="you@example.com" class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500"/>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Password</label>
          <input type="password" id="auth-password" required placeholder="••••••••" class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500"/>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" id="btn-login" onclick="window.authMode='login'" class="flex-1 bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold py-3 rounded-xl transition">
            Sign In
          </button>
          <button type="submit" id="btn-signup" onclick="window.authMode='signup'" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">
            Create Account
          </button>
        </div>
      </form>
      
      <p class="text-[11px] text-center text-slate-400">Powered by Supabase Engine & Paystack</p>
    </div>
  </div>

  <!-- MAIN APP PLATFORM (HIDDEN UNTIL AUTHENTICATED) -->
  <div id="main-app" class="hidden">
    <!-- TOP HEADER & BRAND BAR -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
      <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-scissors text-amber-400 text-lg"></i>
          <h1 class="font-extrabold text-lg tracking-wide bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 bg-clip-text text-transparent">
            StitchLuxe
          </h1>
        </div>
        <div id="auth-header-status" class="flex items-center gap-3">
          <span id="user-display-email" class="text-xs text-slate-300 font-medium"></span>
          <button onclick="handleSignOut()" class="text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 font-bold px-3 py-1.5 rounded-lg transition border border-red-500/20">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN WRAPPER CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6 pb-12">
      <!-- 4-MODULE TAB NAVIGATION BAR -->
      <nav class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-2 overflow-x-auto">
        <button id="tab-catalog" onclick="loadTabContent('catalog')" class="px-4 py-2 rounded-xl bg-slate-900 text-amber-400 font-bold text-xs whitespace-nowrap shadow-sm">
          <i class="fa-solid fa-store mr-1.5"></i> Catalog
        </button>
        <button id="tab-orders" onclick="loadTabContent('orders')" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold text-xs whitespace-nowrap">
          <i class="fa-solid fa-tape mr-1.5"></i> Garment Orders
        </button>
        <button id="tab-resale" onclick="loadTabContent('resale')" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold text-xs whitespace-nowrap">
          <i class="fa-solid fa-shirt mr-1.5"></i> Wardrobe Resale
        </button>
        <button id="tab-apprentice" onclick="loadTabContent('apprentice')" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold text-xs whitespace-nowrap">
          <i class="fa-solid fa-graduation-cap mr-1.5"></i> Apprentice Academy
        </button>
      </nav>

      <!-- DYNAMIC MODULE VIEWPORT -->
      <section id="module-viewport" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm min-h-[400px]">
        <div class="flex flex-col items-center justify-center py-12 text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-amber-500"></i>
          <p class="text-xs font-medium">Loading StitchLuxe ecosystem...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- JAVASCRIPT MODULE IMPORTS -->
  <script src="orders.js"></script>
  <script src="resale.js"></script>
  <script src="apprentice.js"></script>
  <script src="app.js"></script>
</body>
</html>
